<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RYZEN IOS PANELS</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #fff;
      overflow-x: hidden;
    }

    /* Loading screen */
    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #0a0a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .loader-ring {
      width: 80px;
      height: 80px;
      border: 8px solid rgba(0,255,255,0.2);
      border-top: 8px solid #00e6e6;
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    header {
      text-align: center;
      padding: 30px;
      font-size: 2.5em;
      font-weight: bold;
      color: #00e6e6;
      text-shadow: 0 0 25px #00e6e6;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 3px solid rgba(0,255,255,0.6);
      border-radius: 20px;
      padding: 40px;
      width: 95%;
      max-width: 700px;
      box-shadow: 0 0 40px rgba(0,255,255,0.6);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 0 60px rgba(255,0,255,0.8);
    }
    .card h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 2.2em;
      color: #9d7dff;
      text-shadow: 0 0 20px #9d7dff;
      animation: glowText 3s infinite alternate;
    }
    @keyframes glowText {
      from { text-shadow: 0 0 10px #9d7dff; }
      to { text-shadow: 0 0 25px #00ffff; }
    }

    .price {
      font-size: 1.8em;
      margin: 15px 0;
      padding: 18px;
      background: rgba(0,0,0,0.6);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .price:hover {
      background: rgba(0,255,255,0.4);
      transform: scale(1.1);
    }
    .stock {
      font-size: 1.2em;
      margin-top: 8px;
      text-align: center;
    }
    .stock.green { color: #00ff99; }
    .stock.yellow { color: #ffcc00; }
    .stock.red { color: #ff4444; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-content {
      background: #111;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      color: #fff;
      box-shadow: 0 0 40px #00e6e6;
      width: 95%;
      max-width: 600px;
      animation: fadeIn 0.6s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-content h3 {
      font-size: 2em;
      color: #00e6e6;
      text-shadow: 0 0 20px #00e6e6;
    }
    .modal-content p {
      margin: 12px 0;
      font-size: 1.4em;
    }
    .modal-content img {
      width: 380px; /* 30-40% larger QR */
      margin: 20px 0;
      border: 4px solid #00e6e6;
      border-radius: 12px;
      box-shadow: 0 0 25px #00e6e6;
      animation: pulseQR 2s infinite;
    }
    @keyframes pulseQR {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* Payment card style */
    .payment-card {
      background: linear-gradient(135deg, rgba(0,255,255,0.2), rgba(255,0,255,0.2));
      border: 2px solid #00ffff;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      font-size: 1.3em;
      color: #fff;
      text-shadow: 0 0 10px #00ffff;
      box-shadow: 0 0 20px rgba(0,255,255,0.5);
    }

    .close-btn {
      margin-top: 20px;
      padding: 15px 25px;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-size: 1.2em;
      transition: background 0.3s;
    }
    .close-btn:hover {
      background: linear-gradient(90deg, #ff6a00, #ee0979);
    }

    footer {
      text-align: center;
      padding: 25px;
      font-size: 1em;
      color: #aaa;
    }
    .badges {
      margin-top: 12px;
    }
    .badge {
      display: inline-block;
      margin: 6px;
      padding: 8px 14px;
      border: 2px solid #00e6e6;
      border-radius: 8px;
      font-size: 1em;
      color: #00e6e6;
      text-shadow: 0 0 8px #00e6e6;
    }
  </style>
</head>
